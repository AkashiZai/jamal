name: Jamal POS CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  unit-test-and-coverage:
    name: Unit Tests, Coverage & Plato Report
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:coverage
      - name: Run Plato Static Complexity Analysis
        run: npm run plato
      - name: Upload Plato Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plato-complexity-report
          path: reports/plato

  ui-test-and-static-check:
    name: UI Tests (5 Cases) & Static Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: ESLint Static Check
        run: npm run lint
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui

  cd-deploy-hook:
    name: Continuous Deployment (Render/Railway Webhook)
    needs: [ unit-test-and-coverage, ui-test-and-static-check ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger CD Deploy Webhook
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$DEPLOY_HOOK_URL" ]; then
            curl -fsS -X POST "$DEPLOY_HOOK_URL"
            echo "Deployment triggered successfully."
          else
            echo "DEPLOY_HOOK_URL secret not set; skipping webhook trigger."
          fi
