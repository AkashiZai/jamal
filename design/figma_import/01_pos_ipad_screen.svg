<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1194 834" width="1194" height="834" style="background:#FBF8F4; font-family:'Plus Jakarta Sans','Sarabun',sans-serif;">
  <defs>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#231710" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- TOP APP BAR -->
  <rect x="0" y="0" width="1194" height="64" fill="#1A120B"/>
  <rect x="20" y="16" width="32" height="32" rx="8" fill="#C85A32"/>
  <text x="27" y="38" font-size="14" font-weight="bold" fill="#FFFFFF">JM</text>
  <text x="64" y="38" font-size="16" font-weight="bold" fill="#FFFFFF">JAMAL CAFÉ &amp; BAKERY</text>
  <rect x="260" y="22" width="110" height="20" rx="4" fill="#3B6E4C"/>
  <text x="270" y="36" font-size="11" font-weight="600" fill="#FFFFFF">POS • กะเช้า (Zai)</text>
  <circle cx="1140" cy="32" r="6" fill="#22C55E"/>
  <text x="1070" y="36" font-size="12" fill="#968E85">Online (iPad)</text>

  <!-- ================= LEFT: CATALOG (800px) ================= -->
  <!-- Header Bar -->
  <rect x="20" y="80" width="760" height="56" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
  <text x="40" y="113" font-size="15" font-weight="700" fill="#1E1B18">เมนูสินค้าหน้าร้าน (Product Catalog)</text>
  <!-- Search Bar -->
  <rect x="520" y="92" width="240" height="32" rx="8" fill="#F5EFEB" stroke="#EAE3D8"/>
  <text x="540" y="113" font-size="12" fill="#968E85">🔍 ค้นหาเมนูสินค้า...</text>

  <!-- Category Pills -->
  <g transform="translate(20, 150)">
    <rect x="0" y="0" width="100" height="36" rx="10" fill="#231710"/>
    <text x="22" y="23" font-size="13" font-weight="600" fill="#FFFFFF">☕ ทั้งหมด</text>

    <rect x="110" y="0" width="110" height="36" rx="10" fill="#FFFFFF" stroke="#EAE3D8"/>
    <text x="130" y="23" font-size="13" font-weight="600" fill="#1E1B18">กาแฟสด (6)</text>

    <rect x="230" y="0" width="130" height="36" rx="10" fill="#FFFFFF" stroke="#EAE3D8"/>
    <text x="245" y="23" font-size="13" font-weight="600" fill="#1E1B18">ชา &amp; เครื่องดื่ม (4)</text>

    <rect x="370" y="0" width="120" height="36" rx="10" fill="#FFFFFF" stroke="#EAE3D8"/>
    <text x="385" y="23" font-size="13" font-weight="600" fill="#1E1B18">🥐 เบเกอรี่ (4)</text>

    <rect x="500" y="0" width="120" height="36" rx="10" fill="#FFFFFF" stroke="#EAE3D8"/>
    <text x="518" y="23" font-size="13" font-weight="600" fill="#1E1B18">🍰 ของหวาน (3)</text>
  </g>

  <!-- PRODUCT GRID (3x2 Cards) -->
  <!-- Card 1 -->
  <g transform="translate(20, 204)">
    <rect x="0" y="0" width="240" height="280" rx="14" fill="#FFFFFF" stroke="#C85A32" stroke-width="2" filter="url(#cardShadow)"/>
    <rect x="12" y="12" width="216" height="150" rx="10" fill="#EAE3D8"/>
    <text x="80" y="95" font-size="32">☕</text>
    <rect x="20" y="130" width="60" height="22" rx="6" fill="#231710"/>
    <text x="28" y="145" font-size="10" font-weight="bold" fill="#FFFFFF">CUSTOM</text>
    <text x="16" y="185" font-size="14" font-weight="700" fill="#1E1B18">เอสเพรสโซ่เย็น</text>
    <text x="16" y="202" font-size="11" fill="#635C54">Iced Espresso (คั่วกลาง)</text>
    <text x="16" y="240" font-size="18" font-family="'JetBrains Mono',monospace" font-weight="700" fill="#C85A32">฿65.00</text>
    <rect x="170" y="222" width="56" height="26" rx="6" fill="#FDF2ED" stroke="#C85A32"/>
    <text x="180" y="239" font-size="11" font-weight="bold" fill="#C85A32">+ เพิ่ม</text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(280, 204)">
    <rect x="0" y="0" width="240" height="280" rx="14" fill="#FFFFFF" stroke="#EAE3D8" filter="url(#cardShadow)"/>
    <rect x="12" y="12" width="216" height="150" rx="10" fill="#EAE3D8"/>
    <text x="340" y="95" font-size="32">🍊</text>
    <text x="16" y="185" font-size="14" font-weight="700" fill="#1E1B18">อเมริกาโน่น้ำส้ม</text>
    <text x="16" y="202" font-size="11" fill="#635C54">Orange Americano</text>
    <text x="16" y="240" font-size="18" font-family="'JetBrains Mono',monospace" font-weight="700" fill="#C85A32">฿85.00</text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(540, 204)">
    <rect x="0" y="0" width="240" height="280" rx="14" fill="#FFFFFF" stroke="#EAE3D8" filter="url(#cardShadow)"/>
    <rect x="12" y="12" width="216" height="150" rx="10" fill="#EAE3D8"/>
    <text x="600" y="95" font-size="32">🍵</text>
    <text x="16" y="185" font-size="14" font-weight="700" fill="#1E1B18">มัทฉะลาเต้อูจิ</text>
    <text x="16" y="202" font-size="11" fill="#635C54">Uji Matcha Latte (Kyoto)</text>
    <text x="16" y="240" font-size="18" font-family="'JetBrains Mono',monospace" font-weight="700" fill="#C85A32">฿85.00</text>
  </g>

  <!-- Card 4 (Bakery Low Stock) -->
  <g transform="translate(20, 504)">
    <rect x="0" y="0" width="240" height="280" rx="14" fill="#FFFFFF" stroke="#EAE3D8" filter="url(#cardShadow)"/>
    <rect x="12" y="12" width="216" height="150" rx="10" fill="#EAE3D8"/>
    <text x="80" y="395" font-size="32">🥐</text>
    <!-- Stock badge -->
    <rect x="140" y="20" width="80" height="22" rx="6" fill="#C97D28"/>
    <text x="148" y="35" font-size="10" font-weight="bold" fill="#FFFFFF">เหลือ 4 ชิ้น</text>
    <text x="16" y="185" font-size="14" font-weight="700" fill="#1E1B18">ครัวซองต์เนยสด AOP</text>
    <text x="16" y="202" font-size="11" fill="#635C54">Butter Croissant (France)</text>
    <text x="16" y="240" font-size="18" font-family="'JetBrains Mono',monospace" font-weight="700" fill="#C85A32">฿85.00</text>
  </g>

  <!-- Card 5 (Bakery Low Stock) -->
  <g transform="translate(280, 504)">
    <rect x="0" y="0" width="240" height="280" rx="14" fill="#FFFFFF" stroke="#EAE3D8" filter="url(#cardShadow)"/>
    <rect x="12" y="12" width="216" height="150" rx="10" fill="#EAE3D8"/>
    <text x="340" y="395" font-size="32">🍓</text>
    <rect x="140" y="20" width="80" height="22" rx="6" fill="#C97D28"/>
    <text x="148" y="35" font-size="10" font-weight="bold" fill="#FFFFFF">เหลือ 3 ชิ้น</text>
    <text x="16" y="185" font-size="14" font-weight="700" fill="#1E1B18">เดนิชสตรอว์เบอร์รี</text>
    <text x="16" y="202" font-size="11" fill="#635C54">Strawberry Danish</text>
    <text x="16" y="240" font-size="18" font-family="'JetBrains Mono',monospace" font-weight="700" fill="#C85A32">฿95.00</text>
  </g>

  <!-- Card 6 (Out of Stock) -->
  <g transform="translate(540, 504)">
    <rect x="0" y="0" width="240" height="280" rx="14" fill="#FFFFFF" stroke="#EAE3D8" opacity="0.6" filter="url(#cardShadow)"/>
    <rect x="12" y="12" width="216" height="150" rx="10" fill="#EAE3D8"/>
    <text x="600" y="395" font-size="32">🍰</text>
    <rect x="30" y="70" width="180" height="30" rx="6" fill="#1E1B18" opacity="0.85"/>
    <text x="50" y="90" font-size="11" font-weight="bold" fill="#FFFFFF">สินค้าหมด (OUT OF STOCK)</text>
    <text x="16" y="185" font-size="14" font-weight="700" fill="#968E85">บาสก์ชีสเค้กหน้าไหม้</text>
    <text x="16" y="202" font-size="11" fill="#968E85">Burnt Basque Cheesecake</text>
    <text x="16" y="240" font-size="18" font-family="'JetBrains Mono',monospace" font-weight="700" fill="#968E85">฿125.00</text>
  </g>

  <!-- ================= RIGHT: CART SIDEBAR (374px) ================= -->
  <g transform="translate(800, 80)">
    <rect x="0" y="0" width="374" height="734" rx="16" fill="#F5EFEB" stroke="#EAE3D8"/>
    
    <!-- Cart Header -->
    <rect x="0" y="0" width="374" height="60" rx="16" fill="#FFFFFF"/>
    <text x="20" y="36" font-size="16" font-weight="700" fill="#1E1B18">รายการสั่งซื้อ (Active Bill)</text>
    <rect x="230" y="20" width="40" height="22" rx="11" fill="#C85A32"/>
    <text x="245" y="35" font-size="11" font-weight="bold" fill="#FFFFFF">2</text>
    <text x="20" y="52" font-size="10" font-family="'JetBrains Mono',monospace" fill="#968E85">#JM-2026-084</text>

    <!-- Cart Item 1 -->
    <g transform="translate(16, 76)">
      <rect x="0" y="0" width="342" height="74" rx="12" fill="#FFFFFF" stroke="#EAE3D8"/>
      <text x="16" y="25" font-size="13" font-weight="700" fill="#1E1B18">เอสเพรสโซ่เย็น (Iced Espresso)</text>
      <text x="16" y="42" font-size="11" font-weight="500" fill="#C85A32">↳ หวานน้อย 25% • นมโอ๊ต (+฿15)</text>
      <text x="280" y="25" font-size="13" font-family="'JetBrains Mono',monospace" font-weight="700" fill="#1E1B18">฿80.00</text>
      <rect x="260" y="42" width="66" height="24" rx="6" fill="#F5EFEB" stroke="#EAE3D8"/>
      <text x="270" y="58" font-size="12" font-weight="bold" fill="#635C54">-  1  +</text>
    </g>

    <!-- Cart Item 2 -->
    <g transform="translate(16, 160)">
      <rect x="0" y="0" width="342" height="64" rx="12" fill="#FFFFFF" stroke="#EAE3D8"/>
      <text x="16" y="25" font-size="13" font-weight="700" fill="#1E1B18">ครัวซองต์เนยสด AOP</text>
      <text x="16" y="42" font-size="11" fill="#635C54">↳ อบอุ่นร้อน</text>
      <text x="280" y="25" font-size="13" font-family="'JetBrains Mono',monospace" font-weight="700" fill="#1E1B18">฿85.00</text>
      <rect x="260" y="34" width="66" height="24" rx="6" fill="#F5EFEB" stroke="#EAE3D8"/>
      <text x="270" y="50" font-size="12" font-weight="bold" fill="#635C54">-  1  +</text>
    </g>

    <!-- Financial Breakdown Card -->
    <g transform="translate(16, 440)">
      <rect x="0" y="0" width="342" height="150" rx="12" fill="#FFFFFF" stroke="#EAE3D8"/>
      <text x="16" y="28" font-size="12" fill="#635C54">ยอดรวมก่อนภาษี (Subtotal)</text>
      <text x="265" y="28" font-size="12" font-family="'JetBrains Mono',monospace" font-weight="600" fill="#1E1B18">฿154.21</text>
      
      <text x="16" y="52" font-size="12" fill="#635C54">ภาษีมูลค่าเพิ่ม VAT 7%</text>
      <text x="277" y="52" font-size="12" font-family="'JetBrains Mono',monospace" font-weight="600" fill="#1E1B18">฿10.79</text>

      <line x1="16" y1="70" x2="326" y2="70" stroke="#EAE3D8"/>

      <text x="16" y="105" font-size="15" font-weight="700" fill="#1E1B18">ยอดสุทธิ (Total)</text>
      <text x="220" y="110" font-size="24" font-family="'JetBrains Mono',monospace" font-weight="800" fill="#C85A32">฿165.00</text>
    </g>

    <!-- POS Action Buttons (Touch Target >= 56px) -->
    <g transform="translate(16, 610)">
      <rect x="0" y="0" width="105" height="56" rx="12" fill="#FFFFFF" stroke="#EAE3D8"/>
      <text x="30" y="33" font-size="12" font-weight="600" fill="#1E1B18">พักบิล</text>

      <rect x="115" y="0" width="105" height="56" rx="12" fill="#FFFFFF" stroke="#BA3C34"/>
      <text x="135" y="33" font-size="12" font-weight="600" fill="#BA3C34">Void (Admin)</text>

      <!-- Primary Checkout Button -->
      <rect x="230" y="0" width="112" height="56" rx="12" fill="#C85A32"/>
      <text x="255" y="34" font-size="14" font-weight="bold" fill="#FFFFFF">คิดเงิน →</text>
    </g>
  </g>
</svg>
