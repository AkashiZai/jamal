<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1440 900" width="1440" height="900" style="background:#FBF8F4; font-family:'Plus Jakarta Sans','Sarabun',sans-serif;">
  <defs>
    <filter id="modalShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#1A120B" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Dimmed Backdrop -->
  <rect x="0" y="0" width="1440" height="900" fill="#1A120B" fill-opacity="0.6"/>

  <!-- Modal Centered (560 x 620) -->
  <g transform="translate(440, 140)" filter="url(#modalShadow)">
    <rect x="0" y="0" width="560" height="620" rx="24" fill="#FFFFFF" stroke="#EAE3D8"/>

    <!-- Header -->
    <text x="36" y="44" font-size="18" font-weight="800">เพิ่มรายการสินค้าใหม่ (Add New Menu)</text>
    <text x="36" y="68" font-size="12" fill="#635C54">ข้อกำหนด FR-02: เพิ่มเมนูและกำหนดราคาขายเข้าสู่ระบบ POS หน้าร้าน</text>
    <line x1="36" y1="84" x2="524" y2="84" stroke="#EAE3D8"/>

    <!-- Form Body -->
    <!-- Field 1: Name TH & EN -->
    <g transform="translate(36, 105)">
      <text x="0" y="14" font-size="12" font-weight="700">ชื่อเมนูภาษาไทย</text>
      <rect x="0" y="22" width="236" height="42" rx="10" fill="#FDFBF7" stroke="#EAE3D8"/>
      <text x="14" y="48" font-size="13" fill="#1E1B18">คาราเมลมัคคิอาโต้เย็น</text>

      <text x="252" y="14" font-size="12" font-weight="700">ชื่อภาษาอังกฤษ</text>
      <rect x="252" y="22" width="236" height="42" rx="10" fill="#FDFBF7" stroke="#EAE3D8"/>
      <text x="266" y="48" font-size="13" fill="#1E1B18">Iced Caramel Macchiato</text>
    </g>

    <!-- Field 2: Category & SKU -->
    <g transform="translate(36, 185)">
      <text x="0" y="14" font-size="12" font-weight="700">หมวดหมู่สินค้า</text>
      <rect x="0" y="22" width="236" height="42" rx="10" fill="#FDFBF7" stroke="#EAE3D8"/>
      <text x="14" y="48" font-size="13" fill="#1E1B18">☕ กาแฟสด (Coffee) ▾</text>

      <text x="252" y="14" font-size="12" font-weight="700">รหัสสินค้า (Auto-SKU)</text>
      <rect x="252" y="22" width="236" height="42" rx="10" fill="#F5EFEB" stroke="#EAE3D8"/>
      <text x="266" y="48" font-size="13" font-family="'JetBrains Mono',monospace" font-weight="700" fill="#C85A32">CF-04</text>
    </g>

    <!-- Field 3: Cost & Selling Price -->
    <g transform="translate(36, 265)">
      <text x="0" y="14" font-size="12" font-weight="700">ต้นทุนวัตถุดิบ (บาท)</text>
      <rect x="0" y="22" width="236" height="42" rx="10" fill="#FDFBF7" stroke="#EAE3D8"/>
      <text x="14" y="48" font-size="14" font-family="'JetBrains Mono',monospace" fill="#635C54">฿28.00</text>

      <text x="252" y="14" font-size="12" font-weight="700">ราคาขายหน้าร้าน (บาท) *</text>
      <rect x="252" y="22" width="236" height="42" rx="10" fill="#FFF9F5" stroke="#C85A32" stroke-width="1.5"/>
      <text x="266" y="48" font-size="15" font-family="'JetBrains Mono',monospace" font-weight="800" fill="#C85A32">฿75.00</text>
    </g>

    <!-- Field 4: Customization Options -->
    <g transform="translate(36, 350)">
      <text x="0" y="14" font-size="12" font-weight="700">ตัวเลือกการปรับแต่ง (Customization)</text>
      <rect x="0" y="24" width="488" height="52" rx="10" fill="#FDFBF7" stroke="#EAE3D8"/>
      
      <circle cx="24" cy="50" r="8" fill="#3B6E4C"/>
      <text x="24" y="53" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">✓</text>
      <text x="40" y="54" font-size="12" fill="#1E1B18">ระดับความหวาน (100%, 50%, 0%)</text>

      <circle cx="260" cy="50" r="8" fill="#3B6E4C"/>
      <text x="260" y="53" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">✓</text>
      <text x="276" y="54" font-size="12" fill="#1E1B18">เปลี่ยนชนิดนม (นมสด / นมโอ๊ต +฿15)</text>
    </g>

    <!-- Field 5: Image Upload Box -->
    <g transform="translate(36, 442)">
      <rect x="0" y="0" width="488" height="74" rx="12" fill="#FDFBF7" stroke="#C85A32" stroke-dasharray="6,4"/>
      <text x="244" y="32" font-size="20" text-anchor="middle">📷</text>
      <text x="244" y="54" font-size="12" font-weight="600" fill="#C85A32" text-anchor="middle">คลิกเพื่ออัปโหลดรูปภาพสินค้า หรือลากไฟล์มาวางที่นี่</text>
    </g>

    <!-- Action Buttons -->
    <g transform="translate(36, 545)">
      <rect x="0" y="0" width="220" height="48" rx="14" fill="#F5EFEB"/>
      <text x="110" y="29" font-size="13" font-weight="700" fill="#635C54" text-anchor="middle">ยกเลิก</text>

      <rect x="236" y="0" width="252" height="48" rx="14" fill="#C85A32"/>
      <text x="362" y="29" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">✓ บันทึกและเพิ่มเมนู</text>
    </g>
  </g>
</svg>