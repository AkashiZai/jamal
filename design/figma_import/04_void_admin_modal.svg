<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1194 834" width="1194" height="834" style="background:#EDE7DF; font-family:'Plus Jakarta Sans','Sarabun',sans-serif;">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#1A120B" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Dimmed Backdrop -->
  <rect x="0" y="0" width="1194" height="834" fill="#1A120B" fill-opacity="0.55"/>

  <!-- Admin Void Modal (420 x 360) CENTERED -->
  <g transform="translate(387, 237)" filter="url(#shadow)">
    <rect x="0" y="0" width="420" height="360" rx="24" fill="#FFFFFF" stroke="#EAE3D8" stroke-width="1"/>

    <!-- Header Icon & Title -->
    <g transform="translate(24, 28)">
      <circle cx="20" cy="20" r="20" fill="#FDF0EF"/>
      <text x="20" y="27" font-size="18" fill="#BA3C34" text-anchor="middle">🛡️</text>
      <text x="52" y="26" font-size="16" font-weight="800" fill="#1E1B18">อนุมัติ Void บิล (Admin Only)</text>
      
      <!-- Close Button -->
      <circle cx="372" cy="20" r="14" fill="#F5EFEB"/>
      <text x="372" y="25" font-size="12" font-weight="700" fill="#635C54" text-anchor="middle">✕</text>
    </g>

    <line x1="24" y1="78" x2="396" y2="78" stroke="#F5EFEB" stroke-width="1"/>

    <!-- Description -->
    <text x="24" y="106" font-size="12" font-weight="500" fill="#635C54">การยกเลิกบิลต้องใช้รหัสผ่านของผู้จัดการร้าน</text>
    <text x="24" y="126" font-size="11" font-weight="700" fill="#BA3C34">ตามข้อกำหนด FR-07 (Void Protection &amp; Audit Log)</text>

    <!-- PIN Input Field -->
    <g transform="translate(24, 150)">
      <text x="0" y="14" font-size="12" font-weight="700" fill="#1E1B18">รหัสผ่าน Admin PIN (ตัวอย่าง: 9999)</text>
      <rect x="0" y="24" width="372" height="54" rx="14" fill="#FDFBF7" stroke="#EAE3D8" stroke-width="1.5"/>
      <!-- Bullets -->
      <text x="186" y="58" font-size="24" font-family="'JetBrains Mono',monospace" font-weight="900" letter-spacing="8" fill="#BA3C34" text-anchor="middle">● ● ● ●</text>
    </g>

    <!-- Action Buttons -->
    <g transform="translate(24, 275)">
      <!-- Cancel -->
      <rect x="0" y="0" width="176" height="48" rx="14" fill="#F5EFEB"/>
      <text x="88" y="29" font-size="13" font-weight="700" fill="#635C54" text-anchor="middle">ยกเลิก</text>

      <!-- Confirm Void (RED) -->
      <rect x="196" y="0" width="176" height="48" rx="14" fill="#BA3C34"/>
      <text x="284" y="29" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">ยืนยัน Void บิล ✕</text>
    </g>
  </g>
</svg>
