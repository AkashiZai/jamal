<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1194 834" width="1194" height="834" style="background:#EDE7DF; font-family:'Plus Jakarta Sans','Sarabun',sans-serif;">
  <defs>
    <filter id="modalShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#1A120B" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- POS SCREEN IN BACKGROUND (DIMMED) -->
  <rect x="0" y="0" width="1194" height="834" fill="#EDE7DF"/>
  
  <!-- Backdrop Blur Dark Overlay -->
  <rect x="0" y="0" width="1194" height="834" fill="#1A120B" fill-opacity="0.55"/>

  <!-- CUSTOMIZATION MODAL (540 x 620) CENTERED -->
  <g transform="translate(327, 107)" filter="url(#modalShadow)">
    <rect x="0" y="0" width="540" height="620" rx="24" fill="#FFFFFF" stroke="#EAE3D8" stroke-width="1"/>

    <!-- Header -->
    <rect x="0" y="0" width="540" height="74" rx="24" fill="#FBF8F4"/>
    <rect x="0" y="50" width="540" height="24" fill="#FBF8F4"/>
    <line x1="0" y1="74" x2="540" y2="74" stroke="#EAE3D8" stroke-width="1"/>

    <text x="24" y="38" font-size="17" font-weight="800" fill="#1E1B18">เอสเพรสโซ่เย็น (Iced Espresso)</text>
    <text x="24" y="58" font-size="13" font-weight="700" font-family="'JetBrains Mono',monospace" fill="#C85A32">ราคาเริ่มต้น ฿65.00</text>
    
    <!-- Close Button -->
    <circle cx="504" cy="37" r="16" fill="#F5EFEB"/>
    <text x="504" y="42" font-size="14" font-weight="700" fill="#635C54" text-anchor="middle">✕</text>

    <!-- 1. Sweetness Level (4 Columns) -->
    <g transform="translate(24, 94)">
      <text x="0" y="14" font-size="12" font-weight="800" fill="#1E1B18">1. ระดับความหวาน (Sweetness Level)</text>
      <!-- 0% -->
      <g transform="translate(0, 24)">
        <rect x="0" y="0" width="115" height="54" rx="12" fill="#FFFFFF" stroke="#EAE3D8"/>
        <text x="57" y="24" font-size="14" font-weight="800" fill="#1E1B18" text-anchor="middle">0%</text>
        <text x="57" y="42" font-size="10" font-weight="500" fill="#635C54" text-anchor="middle">ไม่หวาน</text>
      </g>
      <!-- 25% (ACTIVE) -->
      <g transform="translate(125, 24)">
        <rect x="0" y="0" width="115" height="54" rx="12" fill="#FDF2ED" stroke="#C85A32" stroke-width="2"/>
        <text x="57" y="24" font-size="14" font-weight="800" fill="#C85A32" text-anchor="middle">25%</text>
        <text x="57" y="42" font-size="10" font-weight="700" fill="#C85A32" text-anchor="middle">หวานน้อย</text>
      </g>
      <!-- 50% -->
      <g transform="translate(250, 24)">
        <rect x="0" y="0" width="115" height="54" rx="12" fill="#FFFFFF" stroke="#EAE3D8"/>
        <text x="57" y="24" font-size="14" font-weight="800" fill="#1E1B18" text-anchor="middle">50%</text>
        <text x="57" y="42" font-size="10" font-weight="500" fill="#635C54" text-anchor="middle">หวานปกติ</text>
      </g>
      <!-- 100% -->
      <g transform="translate(375, 24)">
        <rect x="0" y="0" width="115" height="54" rx="12" fill="#FFFFFF" stroke="#EAE3D8"/>
        <text x="57" y="24" font-size="14" font-weight="800" fill="#1E1B18" text-anchor="middle">100%</text>
        <text x="57" y="42" font-size="10" font-weight="500" fill="#635C54" text-anchor="middle">หวานมาก</text>
      </g>
    </g>

    <!-- 2. Milk Choice -->
    <g transform="translate(24, 200)">
      <text x="0" y="14" font-size="12" font-weight="800" fill="#1E1B18">2. ประเภทนม (Milk Choice)</text>
      <!-- Fresh Milk (ACTIVE) -->
      <g transform="translate(0, 24)">
        <rect x="0" y="0" width="492" height="42" rx="12" fill="#FDF2ED" stroke="#C85A32" stroke-width="2"/>
        <text x="16" y="26" font-size="12" font-weight="800" fill="#C85A32">✓ นมสดวัวแท้ (Fresh Milk)</text>
        <text x="476" y="26" font-size="12" font-weight="800" font-family="'JetBrains Mono',monospace" fill="#C85A32" text-anchor="end">+฿0.00</text>
      </g>
      <!-- Oat Milk -->
      <g transform="translate(0, 72)">
        <rect x="0" y="0" width="492" height="42" rx="12" fill="#FFFFFF" stroke="#EAE3D8"/>
        <text x="16" y="26" font-size="12" font-weight="600" fill="#1E1B18">นมโอ๊ต Oatly (Oat Milk)</text>
        <text x="476" y="26" font-size="12" font-weight="600" fill="#635C54" text-anchor="end">+฿15.00</text>
      </g>
      <!-- Almond Milk -->
      <g transform="translate(0, 120)">
        <rect x="0" y="0" width="492" height="42" rx="12" fill="#FFFFFF" stroke="#EAE3D8"/>
        <text x="16" y="26" font-size="12" font-weight="600" fill="#1E1B18">นมอัลมอนด์ (Almond Milk)</text>
        <text x="476" y="26" font-size="12" font-weight="600" fill="#635C54" text-anchor="end">+฿15.00</text>
      </g>
    </g>

    <!-- 3. Add-ons -->
    <g transform="translate(24, 385)">
      <text x="0" y="14" font-size="12" font-weight="800" fill="#1E1B18">3. ท็อปปิ้งเพิ่มเติม (Add-ons)</text>
      <!-- Extra Shot -->
      <g transform="translate(0, 24)">
        <rect x="0" y="0" width="492" height="42" rx="12" fill="#FFFFFF" stroke="#EAE3D8"/>
        <text x="16" y="26" font-size="12" font-weight="600" fill="#1E1B18">เพิ่มช็อตกาแฟ (Extra Espresso Shot)</text>
        <text x="476" y="26" font-size="12" font-weight="600" fill="#635C54" text-anchor="end">+฿20.00</text>
      </g>
      <!-- Brown Sugar Jelly -->
      <g transform="translate(0, 72)">
        <rect x="0" y="0" width="492" height="42" rx="12" fill="#FFFFFF" stroke="#EAE3D8"/>
        <text x="16" y="26" font-size="12" font-weight="600" fill="#1E1B18">บุกบราวน์ชูการ์เจลลี่ (Brown Sugar Jelly)</text>
        <text x="476" y="26" font-size="12" font-weight="600" fill="#635C54" text-anchor="end">+฿15.00</text>
      </g>
    </g>

    <!-- Modal Footer Actions -->
    <g transform="translate(0, 540)">
      <rect x="0" y="0" width="540" height="80" rx="24" fill="#FBF8F4"/>
      <rect x="0" y="0" width="540" height="30" fill="#FBF8F4"/>
      <line x1="0" y1="0" x2="540" y2="0" stroke="#EAE3D8" stroke-width="1"/>

      <!-- Cancel Button -->
      <rect x="24" y="16" width="130" height="48" rx="14" fill="#FFFFFF" stroke="#EAE3D8"/>
      <text x="89" y="45" font-size="13" font-weight="700" fill="#635C54" text-anchor="middle">ยกเลิก</text>

      <!-- Confirm Button (Total: ฿65.00) -->
      <rect x="166" y="16" width="350" height="48" rx="14" fill="#C85A32"/>
      <text x="341" y="45" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle">เพิ่มลงในบิล • ฿65.00 ✓</text>
    </g>
  </g>
</svg>
