<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1440 900" width="1440" height="900" style="background:#FBF8F4; font-family:'Plus Jakarta Sans','Sarabun',sans-serif;">
  <defs>
    <filter id="modalShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#1A120B" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Dimmed Backdrop -->
  <rect x="0" y="0" width="1440" height="900" fill="#1A120B" fill-opacity="0.6"/>

  <!-- Modal Centered (480 x 420) -->
  <g transform="translate(480, 240)" filter="url(#modalShadow)">
    <rect x="0" y="0" width="480" height="420" rx="24" fill="#FFFFFF" stroke="#EAE3D8"/>

    <!-- Header -->
    <text x="32" y="44" font-size="18" font-weight="800">แก้ไขราคาขายเมนู (FR-02)</text>
    <text x="32" y="68" font-size="12" fill="#635C54">เอสเพรสโซ่เย็น (Iced Espresso) • SKU: CF-01</text>
    <line x1="32" y1="84" x2="448" y2="84" stroke="#EAE3D8"/>

    <!-- Current Price info -->
    <g transform="translate(32, 105)">
      <rect x="0" y="0" width="416" height="48" rx="10" fill="#FDFBF7" stroke="#EAE3D8"/>
      <text x="16" y="29" font-size="12" fill="#635C54">ราคาขายปัจจุบัน: <tspan font-family="'JetBrains Mono',monospace" font-weight="700" fill="#1E1B18">฿65.00</tspan></text>
      <text x="400" y="29" font-size="12" fill="#635C54" text-anchor="end">ต้นทุนวัตถุดิบ: <tspan font-family="'JetBrains Mono',monospace" font-weight="700" fill="#968E85">฿22.00</tspan></text>
    </g>

    <!-- New Price Input -->
    <g transform="translate(32, 175)">
      <text x="0" y="14" font-size="12" font-weight="700">กำหนดราคาขายใหม่หน้าร้าน (บาท)</text>
      <rect x="0" y="24" width="416" height="52" rx="14" fill="#FDFBF7" stroke="#C85A32" stroke-width="2"/>
      <text x="20" y="58" font-size="24" font-family="'JetBrains Mono',monospace" font-weight="900" fill="#C85A32">฿70.00</text>
      <text x="400" y="56" font-size="11" font-weight="700" fill="#3B6E4C" text-anchor="end">+฿5.00 (+7.7%)</text>
    </g>

    <!-- Sync Alert Note -->
    <g transform="translate(32, 275)">
      <rect x="0" y="0" width="416" height="44" rx="10" fill="#EAF4ED"/>
      <text x="14" y="27" font-size="11" font-weight="600" fill="#3B6E4C">⚡ ระบบจะอัปเดตราคาใหม่ไปยัง POS &amp; Mobile ทันทีหลังกดยืนยัน</text>
    </g>

    <!-- Buttons -->
    <g transform="translate(32, 340)">
      <rect x="0" y="0" width="190" height="48" rx="14" fill="#F5EFEB"/>
      <text x="95" y="29" font-size="13" font-weight="700" fill="#635C54" text-anchor="middle">ยกเลิก</text>

      <rect x="206" y="0" width="210" height="48" rx="14" fill="#C85A32"/>
      <text x="311" y="29" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">✓ บันทึกราคาใหม่</text>
    </g>
  </g>
</svg>
