<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — JAMAL POS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-[#FBF8F4] flex items-center justify-center p-6" style="font-family:'Plus Jakarta Sans','Sarabun',sans-serif;">
  <div class="w-full max-w-md bg-white rounded-3xl p-8 border border-[#EAE3D8] shadow-2xl space-y-6">
    <div class="text-center space-y-1.5">
      <div class="w-14 h-14 rounded-2xl bg-[#1A120B] text-white flex items-center justify-center mx-auto text-xl font-bold">
        JM
      </div>
      <h1 class="text-2xl font-bold text-[#1E1B18]">เข้าสู่ระบบ JAMAL POS</h1>
      <p class="text-xs text-[#635C54]">Café &amp; Bakery Management System</p>
    </div>

    <!-- Role Selector -->
    <div class="grid grid-cols-3 gap-1.5 bg-[#F5EFEB] p-1.5 rounded-xl text-xs font-bold">
      <button class="py-2.5 rounded-lg bg-[#C85A32] text-white shadow">แคชเชียร์</button>
      <button class="py-2.5 rounded-lg text-[#635C54]">บาริสต้า/ครัว</button>
      <button class="py-2.5 rounded-lg text-[#635C54]">เจ้าของร้าน</button>
    </div>

    <div class="space-y-4 text-xs">
      <div>
        <label class="block font-bold text-[#1E1B18] mb-1.5">รหัสพนักงาน หรือชื่อผู้ใช้</label>
        <input type="text" value="cashier_zai" class="w-full px-4 py-3 bg-[#FDFBF7] border border-[#EAE3D8] rounded-xl font-medium text-sm">
      </div>
      <div>
        <div class="flex justify-between items-center mb-1.5">
          <label class="font-bold text-[#1E1B18]">รหัสผ่าน หรือ PIN 4 หลัก</label>
          <span class="text-[11px] text-[#C85A32] font-semibold">ลืมรหัสผ่าน?</span>
        </div>
        <input type="password" value="••••" class="w-full px-4 py-3 bg-[#FDFBF7] border border-[#EAE3D8] rounded-xl font-mono text-base tracking-widest">
      </div>
    </div>

    <button class="w-full py-4 bg-[#231710] text-white rounded-2xl text-sm font-bold hover:bg-[#1A120B] transition shadow-lg">
      เข้าสู่ระบบ (Sign In) →
    </button>

    <p class="text-center text-[11px] text-[#968E85]">
      ระบบความปลอดภัย: Timeout Logout อัตโนมัติเมื่อไม่ใช้งานเกิน 15 นาที (NFR-04)
    </p>
  </div>
</body>
</html>
